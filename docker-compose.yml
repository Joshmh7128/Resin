services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: resin
    ports:
      - "5433:5432"
    volumes:
      - resin-postgres-data:/var/lib/postgresql/data

volumes:
  resin-postgres-data:
