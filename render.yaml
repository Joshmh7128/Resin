services:
  - type: web
    name: resin
    runtime: node
    plan: free
    # Deploy from master. Without this Render follows the repo default branch,
    # which is easy to leave behind and quietly ship stale code.
    branch: master
    # `--include=dev` is required: NODE_ENV=production (set below, and needed at
    # runtime for secure cookies) makes npm skip devDependencies, but the build
    # needs them. Tailwind, its PostCSS plugin, and TypeScript all live there.
    #
    # `prisma generate` must be explicit: npm 11 blocks dependency postinstall
    # scripts by default, so Prisma's own postinstall no longer generates the
    # client and the build would fail on a stub.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Neon's "pooled" connection string (hostname contains -pooler), used by
      # the app for its normal queries.
      - key: DATABASE_URL
        sync: false
      # Neon's direct connection string (no -pooler). Used only for migrations,
      # which take a session-level advisory lock the pooler cannot hold.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Your Render service's public URL (or custom domain), used when
      # generating the storefront QR code.
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      # Discogs app credentials. Raise the API ceiling from 25 to 60 req/min.
      # Set these in the Render dashboard. Never commit them.
      - key: DISCOGS_CONSUMER_KEY
        sync: false
      - key: DISCOGS_CONSUMER_SECRET
        sync: false
      # Bearer token for POST /api/admin/premium-expiry, the scheduled sweep
      # that warns stores whose premium is nearly up and moves lapsed ones back
      # to free. Generated here; copy it into whatever scheduler calls it.
      # Without it the endpoint is disabled and the sweep is manual only.
      - key: CRON_SECRET
        generateValue: true
      # Outbound email for password resets and expiry notices. Leave unset and
      # those messages are only written to the log; the admin backend then
      # shows reset links on screen instead.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
